<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="galwayMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990040"/>
      <stop offset="100%" stop-color="#70002b"/>
    </linearGradient>
    <linearGradient id="galwayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#e08200"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Crest Emblem Container (Quadrangle & Heraldic Shield) -->
  <g transform="translate(10, 10)">
    <!-- Shield Base -->
    <path d="M 15 10 L 85 10 L 85 60 C 85 85, 50 98, 50 98 C 50 98, 15 85, 15 60 Z" 
          fill="url(#galwayMaroon)" stroke="#ffffff" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Gold Trim Inner Border -->
    <path d="M 20 15 L 80 15 L 80 58 C 80 78, 50 90, 50 90 C 50 90, 20 78, 20 58 Z" 
          fill="none" stroke="url(#galwayGold)" stroke-width="1.8"/>

    <!-- Historic Quadrangle Tower Silhouette -->
    <!-- Central Tower -->
    <rect x="44" y="24" width="12" height="26" fill="url(#galwayGold)"/>
    <polygon points="43,24 50,17 57,24" fill="url(#galwayGold)"/>
    <!-- Left & Right Turrets -->
    <rect x="33" y="30" width="8" height="20" fill="url(#galwayGold)"/>
    <polygon points="32,30 37,25 42,30" fill="url(#galwayGold)"/>
    <rect x="59" y="30" width="8" height="20" fill="url(#galwayGold)"/>
    <polygon points="58,30 63,25 68,30" fill="url(#galwayGold)"/>
    <!-- Gothic Arches -->
    <path d="M 47 43 A 3 3 0 0 1 53 43 L 53 50 L 47 50 Z" fill="#70002b"/>
    <path d="M 35 45 A 2 2 0 0 1 39 45 L 39 50 L 35 50 Z" fill="#70002b"/>
    <path d="M 61 45 A 2 2 0 0 1 65 45 L 65 50 L 61 50 Z" fill="#70002b"/>

    <!-- Galway Galley Ship (Maritime Heritage) -->
    <path d="M 32 66 Q 50 74 68 66 L 65 72 Q 50 80 35 72 Z" fill="#ffffff"/>
    <line x1="50" y1="56" x2="50" y2="68" stroke="#ffffff" stroke-width="2"/>
    <polygon points="50,56 42,62 50,65" fill="url(#galwayGold)"/>
    <polygon points="51,57 58,62 51,65" fill="url(#galwayGold)"/>

    <!-- 3 Golden Stars / Mullets of Excellence -->
    <polygon points="30,22 31.5,25.5 35,26 32.5,28.5 33,32 30,30 27,32 27.5,28.5 25,26 28.5,25.5" fill="url(#galwayGold)"/>
    <polygon points="70,22 71.5,25.5 75,26 72.5,28.5 73,32 70,30 67,32 67.5,28.5 65,26 68.5,25.5" fill="url(#galwayGold)"/>
    <circle cx="50" cy="85" r="2.5" fill="url(#galwayGold)"/>
  </g>

  <!-- Typography: Bilingual Institutional Wordmark -->
  <!-- Irish: Ollscoil na Gaillimhe -->
  <text x="115" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Georgia, serif" font-weight="700" font-size="20" fill="#860038" letter-spacing="0.5">
    Ollscoil na Gaillimhe
  </text>
  
  <!-- English: University of Galway -->
  <text x="115" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Georgia, serif" font-weight="600" font-size="19" fill="#1e293b" letter-spacing="0.2">
    University of Galway
  </text>

  <!-- Department / Faculty Subtitle -->
  <text x="115" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', monospace" font-weight="600" font-size="11" fill="#f39200" letter-spacing="1.2">
    SCHOOL OF COMPUTER SCIENCE · IOT STUDIO
  </text>
</svg>
