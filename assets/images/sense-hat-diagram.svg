    <rect x="254" y="238" width="22" height="22" rx="4" fill="#b91c1c" filter="url(#glow)"/>
    <rect x="284" y="238" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="314" y="238" width="22" height="22" rx="4" fill="#1e293b"/>
    <!-- Row 4 -->
    <rect x="104" y="268" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="134" y="268" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="164" y="268" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="194" y="268" width="22" height="22" rx="4" fill="#b91c1c" filter="url(#glow)"/>
