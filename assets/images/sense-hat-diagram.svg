    <rect x="134" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="164" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="194" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="224" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="254" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="284" y="328" width="22" height="22" rx="4" fill="#1e293b"/>
