    <rect x="314" y="358" width="22" height="22" rx="4" fill="#1e293b"/>
  </g>

  <!-- Hardware Sensors Panel -->
  <rect x="390" y="110" width="330" height="135" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="410" y="135" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold">I2C BUS SENSORS (0x5F, 0x5C, 0x6A)</text>
  <text x="410" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="12">• HTS221: Temperature &amp; Relative Humidity</text>
  <text x="410" y="180" fill="#e2e8f0" font-family="sans-serif" font-size="12">• LPS25H: Barometric Atmospheric Pressure</text>
  <text x="410" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="12">• LSM9DS1: 9-DoF IMU (Gyro · Accel · Magnet)</text>
  <text x="410" y="225" fill="#34d399" font-family="monospace" font-size="11">Kernel sysfs / devicetree: rpi-sense-overlay</text>

  <!-- 5-Way Joystick & Microcontroller -->
  <rect x="390" y="260" width="330" height="130" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="410" y="285" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">ATTINY88 MCU &amp; 5-WAY JOYSTICK</text>
  <text x="410" y="310" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Joystick: Up, Down, Left, Right, Enter (Click)</text>
  <text x="410" y="330" fill="#e2e8f0" font-family="sans-serif" font-size="12">• Event queue: /dev/input/event* Linux evdev</text>
  <text x="410" y="355" fill="#38bdf8" font-family="monospace" font-size="11">Bidirectional Twin State Synchronization</text>
</svg>
