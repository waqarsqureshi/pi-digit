    <rect x="104" y="358" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="134" y="358" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="164" y="358" width="22" height="22" rx="4" fill="#1e293b"/>
