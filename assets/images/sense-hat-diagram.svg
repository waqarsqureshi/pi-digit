<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3e2e"/>
      <stop offset="100%" stop-color="#08231a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="ledOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Raspberry Pi PCB background -->
  <rect x="40" y="30" width="720" height="400" rx="20" fill="url(#boardGrad)" stroke="#1e5f49" stroke-width="4"/>

  <!-- Mounting holes -->
  <circle cx="75" cy="65" r="12" fill="#141e1b" stroke="#718096" stroke-width="2"/>
  <circle cx="725" cy="65" r="12" fill="#141e1b" stroke="#718096" stroke-width="2"/>
  <circle cx="75" cy="395" r="12" fill="#141e1b" stroke="#718096" stroke-width="2"/>
  <circle cx="725" cy="395" r="12" fill="#141e1b" stroke="#718096" stroke-width="2"/>

  <!-- 40-Pin GPIO Header -->
  <rect x="100" y="45" width="600" height="34" rx="4" fill="url(#headerGrad)" stroke="#4a5568" stroke-width="1.5"/>
  <text x="400" y="67" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="bold">40-PIN EXPANSION HEADER (I2C-1 · SPI-0 · UART · GPIO 0-27)</text>

  <!-- Sense HAT 8x8 Matrix Container -->
  <rect x="80" y="110" width="280" height="280" rx="12" fill="#090d16" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="132" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="bold">8×8 RGB LED MATRIX (/dev/fb1)</text>

  <!-- 8x8 Grid of LEDs (with colorful heart pattern) -->
  <g id="matrix-leds">
    <!-- Row 0 -->
    <rect x="104" y="148" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="134" y="148" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="164" y="148" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="194" y="148" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="224" y="148" width="22" height="22" rx="4" fill="#1e293b"/>
    <rect x="254" y="148" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="284" y="148" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="314" y="148" width="22" height="22" rx="4" fill="#1e293b"/>
    <!-- Row 1 -->
    <rect x="104" y="178" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="134" y="178" width="22" height="22" rx="4" fill="#dc2626" filter="url(#glow)"/>
    <rect x="164" y="178" width="22" height="22" rx="4" fill="#dc2626" filter="url(#glow)"/>
    <rect x="194" y="178" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="224" y="178" width="22" height="22" rx="4" fill="#ef4444" filter="url(#glow)"/>
    <rect x="254" y="178" width="22" height="22" rx="4" fill="#dc2626" filter="url(#glow)"/>
